registry:
  server: "localhost:5555"

servers:
  web:
    - <%= ENV["SERVER_IP"] %>

builder:
  dockerfile: Dockerfile.dev

volumes:
  - "/var/lib/portfolio-db:/rails/storage"

ssh:
  user: deployer
  keys_only: true
  key_data:
    - SSH_PRIVATE_KEY

proxy:
  ssl: true
  host: dev.kpasqualoni.com
  response_timeout: 60
  healthcheck:
    path: /up
    interval: 2
    timeout: 5