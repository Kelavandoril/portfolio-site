registry:
  server: "ghcr.io"
  username: Kelavandoril
  password:
    - KAMAL_REGISTRY_PASSWORD

servers:
  web:
    - <%= ENV["SERVER_IP"] %>

builder:
  dockerfile: Dockerfile

volumes:
  - /var/lib/portfolio-db:/rails/storage:z

ssh:
  user: deployer
  keys_only: true
  key_data:
    - SSH_PRIVATE_KEY

proxy:
  ssl: true
  host: www.kpasqualoni.com
  response_timeout: 60
  healthcheck:
    path: /up
    interval: 2
    timeout: 5